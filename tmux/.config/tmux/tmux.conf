set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"

set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

setw -g monitor-activity on
set -g visual-activity off
set -g activity-action other

set -g set-titles on
set -g set-titles-string "#{session_name}:#{window_index} #{pane_current_command}"
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Keep new windows in the current pane's directory
bind c new-window -c "#{pane_current_path}"

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

setw -g mode-keys vi

if-shell 'grep -qi microsoft /proc/sys/kernel/osrelease' {
  set -s copy-command "/mnt/c/Windows/System32/clip.exe"
} {
  set -s copy-command "wl-copy"
}

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-position top

# Kanagawa-inspired status styling
set -g status-style "bg=#1f1f28,fg=#dcd7ba"
set -g message-style "bg=#2d4f67,fg=#dcd7ba"
set -g mode-style "bg=#2d4f67,fg=#dcd7ba"

set -g pane-border-style "fg=#363646"
set -g pane-active-border-style "fg=#7e9cd8"

set -g status-left-length 30
set -g status-right-length 80

set -g status-left "#{?client_prefix,#[fg=#1f1f28\,bg=#e6c384\,bold] PREFIX ,#[fg=#1f1f28\,bg=#7e9cd8\,bold] #S }#[default] "
set -g status-right "#[fg=#727169]#{pane_current_path}  #[fg=#dcd7ba]%H:%M "

setw -g window-status-format " #[fg=#727169]#I:#W#F "
setw -g window-status-current-format " #[fg=#1f1f28,bg=#98bb6c,bold]#I:#W#F#[default] "
setw -g window-status-separator ""
