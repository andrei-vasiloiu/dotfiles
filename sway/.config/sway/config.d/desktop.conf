# Desktop applications
bindsym $mod+e exec thunar
bindsym $mod+Ctrl+l exec swaylock
bindsym $mod+Shift+e exec power-menu

# Clipboard history
bindsym $mod+Shift+v exec \
  cliphist list | fuzzel --dmenu --prompt="Clipboard › " | cliphist decode | wl-copy

# Audio
bindsym XF86AudioRaiseVolume exec \
  wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+

bindsym XF86AudioLowerVolume exec \
  wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bindsym XF86AudioMute exec \
  wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindsym XF86AudioMicMute exec \
  wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindsym XF86MonBrightnessUp exec brightnessctl set +5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# Screenshots
bindsym Print exec \
  grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

bindsym Shift+Print exec \
  grim -g "$(slurp)" - | swappy -f -

bindsym $mod+Print exec \
  grim -g "$(swaymsg -t get_tree | jq -r '.. | select(.focused? == true).rect | "\(.x),\(.y) \(.width)x\(.height)"')" - | wl-copy
